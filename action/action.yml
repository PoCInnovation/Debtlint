name: debtlint
description: Identifies repeated or near-duplicate code segments across a codebase.
author: poc-innovation
branding:
  icon: "check-circle"
  color: "green"

inputs:
  files:
    description: "File passed to the program."
    required: false

runs:
  using: composite
  steps:
    - name: Setup nu shell
      uses: hustcer/setup-nu@v3
      with:
        version: 0.114.1

    - name: Install debtlint
      shell: nu {0}
      run: cargo install debtlint
    
    - name: Install dependencies
      shell: nu {0}
      run: npm install
      working-directory: ./action

    - name: Run debtlint
      shell: nu {0}
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: npx tsx ${{ github.action_path }}/index.ts